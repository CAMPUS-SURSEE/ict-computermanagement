<!DOCTYPE html>
<html lang="de-CH" class="ds-theme ds-base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f2">
<title>Styleguide – ICT-Inventar</title>
<link rel="icon" type="image/webp" href="https://www.campus-sursee.ch/wp-content/uploads/2023/12/campus-sursee-favicon.webp">
<!-- Lebende Übersicht im echten Rahmen: jede Komponente wird von
     styleguide.js über dieselben Bauer gebaut wie in den Seiten (UI.*,
     Rahmen.*, Bewegung.*); nichts hier ist von Hand nachgebaut. Ohne
     Anmeldung und ohne Daten zu öffnen. Die Grundlage ist Dashboard-Style;
     sein eigener Styleguide (im Repository saschazesiger/Dashboard-Style,
     styleguide/index.html) zeigt die gemeinsamen Bausteine neutral. Das
     Layout dieser Seite steht in styleguide.css (kein <style>: die
     Inhaltsrichtlinie in _headers erlaubt keins). Reihenfolge der
     Stilvorlagen wie in jeder Seite (index.html). -->
<!-- Das erste Bild wartet, bis rahmen.js Kopf und Schublade gebaut hat
     (#rahmen-gebaut steht direkt nach rahmen.js), nicht aber auf MSAL
     vom CDN. Zeigt Chrome eine halb geparste Seite, bricht es sonst den
     Seitenübergang ab («ViewTransition opt-in disabled», auf dem Telefon
     bei jedem zweiten Wechsel); so empfiehlt es auch
     optional/view-transitions.css. -->
<link rel="expect" href="#rahmen-gebaut" blocking="render">
<link rel="stylesheet" href="grund.css">
<link rel="stylesheet" href="vendor/dashboard-style/fonts/fonts.css">
<link rel="stylesheet" href="vendor/dashboard-style/ds.css">
<link rel="stylesheet" href="vendor/dashboard-style/css/optional/view-transitions.css">
<link rel="stylesheet" href="thema.css">
<link rel="stylesheet" href="bausteine.css">
<link rel="stylesheet" href="rahmen.css">
<link rel="stylesheet" href="styleguide.css">
</head>
<!-- data-seite="styleguide": rahmen.js baut Kopf und Schublade; die
     Schublade zeigt die Abschnitte dieser Seite (Anker, die Pille folgt
     beim Rollen). -->
<body>

<div class="ds-app ds-app--drawer" data-seite="styleguide">

  <a class="ds-skip" href="#inhalt">Zum Inhalt</a>

  <div class="ds-topbar" id="kopf"></div>

  <div class="ds-scrim"></div>
  <nav class="ds-drawer" id="schublade" aria-label="Abschnitte" tabindex="-1"></nav>

  <div class="ds-panel">
    <main class="ds-view" id="tafel" tabindex="-1">
      <div class="ds-content">
        <div class="ds-page" id="inhalt" data-zustand="laden">
          <!-- styleguide.js baut die Abschnitte hier hinein. -->
        </div>
      </div>
    </main>
  </div>

</div>

<!-- Meldungen (UI.meldung über DS.overlay.toast): direkt nach .ds-app,
     ohne role und aria-live; die Ansagen legt Dashboard-Style daneben an. -->
<div class="ds-toasts"></div>

<script src="vendor/dashboard-style/ds.js"></script>
<script src="bausteine.js"></script>
<script src="rahmen.js"></script>
<div id="rahmen-gebaut" hidden></div>
<script src="styleguide.js"></script>

</body>
</html>
