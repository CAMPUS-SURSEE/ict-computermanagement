<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f2">
<!-- Platzhalter: software.js setzt «<Programm> – ICT-Inventar» über
     F.seitenkopf({ titel }); im Fehlerzustand setzt F.zeigeFehler den Titel. -->
<title>Programm – ICT-Inventar</title>
<link rel="icon" type="image/webp" href="https://www.campus-sursee.ch/wp-content/uploads/2023/12/campus-sursee-favicon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&family=Archivo:wdth,wght@112,500..700&display=swap">
<!-- Reihenfolge ist wichtig: Tokens und Komponenten, Bewegung, Rahmen, dann
     nur noch das Seitenlayout dieses Fensters. Die Zeile mit
     @view-transition muss inline stehen (Chrome prüft das Opt-in, bevor
     externe Stilvorlagen gelten); die CSP erlaubt Inline-Stile. -->
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="bewegung.css">
<link rel="stylesheet" href="rahmen.css">
<style>@view-transition { navigation: auto; }</style>
<link rel="stylesheet" href="software.css">
</head>
<!-- rahmen.js baut Kopf und Schublade sofort beim Laden; die Bereiche
     («Stammdaten», «Berechtigte») zeichnet fenster.js (F.navZeichnen) in
     die Schublade. -->
<body class="app" data-seite="software">

<a class="sprungmarke" href="#inhalt">Zum Inhalt</a>

<!-- Kopfzeile: Wortmarke, Konto, «Abmelden» (rahmen.js). -->
<header class="kopf" id="kopf"></header>

<!-- Schublade mit den Bereichen des Programms (≤ 900 px modal). -->
<nav class="schublade" id="schublade" aria-label="Bereiche"></nav>

<!-- Die weisse Tafel: der Rahmen rundet, main rollt (einziger Roller). -->
<div class="tafel-rahmen">
  <main class="tafel" id="tafel" tabindex="-1">
    <div class="ladebalken" id="ladebalken" hidden></div>
    <!-- data-zustand="laden": bis zum ersten Inhalt sind Seitenkopf und
         Bereich ausgeblendet, nach 200 ms erscheint das Skelett. Den
         Seitenkopf füllt F.seitenkopf, den Bereich F.zeichneBereich.
         Dialog, Meldungen, Tooltip, Speicherleiste und Vorschlagslisten
         baut rahmen.js bzw. bausteine.js selbst: KEIN statisches Markup. -->
    <div class="bahn" id="inhalt" data-zustand="laden">
      <header class="seitenkopf" id="sw-kopf"></header>
      <div class="fenster-bereich" id="sw-bereich"></div>
    </div>
  </main>
</div>

<script src="konfig.js"></script>
<script src="bewegung.js"></script>
<script src="bausteine.js"></script>
<script src="rahmen.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
        integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="spalten.js"></script>
<script src="auth.js"></script>
<script src="graph.js"></script>
<script src="modell.js"></script>
<script src="fenster.js"></script>
<script src="software.js"></script>

</body>
</html>
