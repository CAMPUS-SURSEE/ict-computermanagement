<!DOCTYPE html>
<html lang="de-CH" class="ds-theme ds-base">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f2">
<title>Übersicht – ICT-Inventar</title>
<link rel="icon" type="image/webp" href="https://www.campus-sursee.ch/wp-content/uploads/2023/12/campus-sursee-favicon.webp">
<!-- Reihenfolge ist wichtig: Dashboard-Style (Schrift, Tokens und Bausteine),
     das Campus-Thema, die ICT-eigenen Bausteine und der Rahmen, dann nur noch
     das Seitenlayout. Alles liegt auf demselben Ursprung (Inhaltsrichtlinie). -->
<link rel="stylesheet" href="vendor/dashboard-style/fonts/fonts.css">
<link rel="stylesheet" href="vendor/dashboard-style/ds.css">
<link rel="stylesheet" href="thema.css">
<link rel="stylesheet" href="bausteine.css">
<link rel="stylesheet" href="rahmen.css">
<link rel="stylesheet" href="styles.css">
<!-- Seitenübergänge: das Opt-in muss inline im head stehen (aus einer
     Stilvorlage bricht Chrome den Übergang meist ab, rahmen.css §11). -->
<style>@view-transition { navigation: auto; }</style>
</head>
<!-- rahmen.js baut Kopf und Schublade sofort aus Rahmen.HAUPTZIELE; der
     aktive Eintrag kommt aus dem Hash (#admin, #edu …) und ist vom ersten
     Bild an markiert. -->
<body class="ds-app ds-app--drawer" data-seite="index">

<a class="ds-skip" href="#inhalt">Zum Inhalt</a>

<header class="ds-topbar" id="kopf"></header>

<nav class="ds-drawer" id="schublade" aria-label="Hauptnavigation"></nav>

<div class="ds-panel">
  <main class="ds-view" id="tafel" tabindex="-1">
    <div class="ds-loadbar" id="ladebalken" hidden><span class="ds-loadbar__bar"></span></div>
    <!-- Zehn Ansichten (je Modul eine Übersicht, dazu die Listen), jede mit
         eigenem Seitenkopf; app.js baut ihren
         Inhalt einmal beim Start und zeichnet danach nur nach. Sichtbar ist
         genau eine, die übrigen tragen hidden. Bis zum ersten Inhalt
         (Rahmen.zustand('inhalt')) blendet data-zustand="laden" alle aus;
         nach 200 ms erscheint das Skelett. Tabellenansichten füllen die
         Tafel (Rahmen.fest), ihr Tabellenrahmen rollt selbst. -->
    <div class="ds-content">
      <div class="ds-page" id="inhalt" data-zustand="laden">
        <section class="ansicht ds-stack" id="ansicht-geraete" aria-labelledby="geraete-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-verzeichnis" aria-labelledby="verzeichnis-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-videoueberwachung" aria-labelledby="videoueberwachung-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-admin" aria-labelledby="admin-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-edu" aria-labelledby="edu-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-benutzer" aria-labelledby="benutzer-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-telefone" aria-labelledby="telefone-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-software" aria-labelledby="software-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-kameras" aria-labelledby="kameras-titel" hidden></section>
        <section class="ansicht ds-stack" id="ansicht-kamerarechte" aria-labelledby="kamerarechte-titel" hidden></section>
      </div>
    </div>
  </main>
</div>

<script src="konfig.js"></script>
<script src="vendor/dashboard-style/ds.js"></script>
<script src="bausteine.js"></script>
<script src="rahmen.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
        integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="spalten.js"></script>
<script src="auth.js"></script>
<script src="graph.js"></script>
<script src="modell.js"></script>
<script src="app.js"></script>

</body>
</html>
