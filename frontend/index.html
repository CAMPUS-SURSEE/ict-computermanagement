<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f2">
<title>Übersicht – ICT-Inventar</title>
<link rel="icon" type="image/webp" href="https://www.campus-sursee.ch/wp-content/uploads/2023/12/campus-sursee-favicon.webp">
<!-- Google Sans und Archivo (Wortmarke) von Google Fonts. Die Inhaltsrichtlinie
     in _headers erlaubt fonts.googleapis.com (Stil) und fonts.gstatic.com
     (Schriftdateien). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&family=Archivo:wdth,wght@112,500..700&display=swap">
<!-- design.css: Tokens und Bausteine; bewegung.css: alle Bewegungen;
     rahmen.css: Rahmen und Ebenen; styles.css: nur das Layout dieser Seite. -->
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="bewegung.css">
<link rel="stylesheet" href="rahmen.css">
<link rel="stylesheet" href="styles.css">
<!-- Seitenübergänge: das Opt-in muss inline im head stehen (aus einer
     Stilvorlage bricht Chrome den Übergang meist ab, rahmen.css §13). -->
<style>@view-transition { navigation: auto; }</style>
</head>
<!-- rahmen.js baut Kopf und Schublade sofort aus Rahmen.HAUPTZIELE; der
     aktive Eintrag kommt aus dem Hash (#admin, #edu …) und ist vom ersten
     Bild an markiert. -->
<body class="app" data-seite="index">

<a class="sprungmarke" href="#inhalt">Zum Inhalt</a>

<header class="kopf" id="kopf"></header>

<nav class="schublade" id="schublade" aria-label="Hauptnavigation"></nav>

<div class="tafel-rahmen">
  <main class="tafel" id="tafel" tabindex="-1">
    <div class="ladebalken" id="ladebalken" hidden></div>
    <!-- Zehn Ansichten (je Modul eine Übersicht, dazu die Listen), jede mit
         eigenem Seitenkopf; app.js baut ihren
         Inhalt einmal beim Start und zeichnet danach nur nach. Sichtbar ist
         genau eine, die übrigen tragen hidden. Bis zum ersten Inhalt
         (Rahmen.zustand('inhalt')) blendet data-zustand="laden" alle aus;
         nach 200 ms erscheint das Skelett. Tabellenansichten füllen die
         Tafel (Rahmen.fest), ihr Tabellenrahmen rollt selbst. -->
    <div class="bahn" id="inhalt" data-zustand="laden">
      <section class="ansicht stapel" id="ansicht-geraete" aria-labelledby="geraete-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-verzeichnis" aria-labelledby="verzeichnis-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-videoueberwachung" aria-labelledby="videoueberwachung-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-admin" aria-labelledby="admin-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-edu" aria-labelledby="edu-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-benutzer" aria-labelledby="benutzer-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-telefone" aria-labelledby="telefone-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-software" aria-labelledby="software-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-kameras" aria-labelledby="kameras-titel" hidden></section>
      <section class="ansicht stapel" id="ansicht-kamerarechte" aria-labelledby="kamerarechte-titel" hidden></section>
    </div>
  </main>
</div>

<script src="konfig.js"></script>
<script src="bewegung.js"></script>
<script src="bausteine.js"></script>
<script src="rahmen.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
        integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="spalten.js"></script>
<script src="auth.js"></script>
<script src="graph.js"></script>
<script src="modell.js"></script>
<script src="app.js"></script>

</body>
</html>
