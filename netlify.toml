# Netlify-Konfiguration für das Computer Inventar
#
# Ausgeliefert wird der Ordner `frontend`, und zwar unverändert. Die Webseite
# ist reines HTML, CSS und JavaScript. Es gibt keinen Bauprozess, keine
# Abhängigkeiten und keinen Zwischenschritt: Was in `frontend` liegt, ist genau
# das, was im Netz steht.
#
# WICHTIG: Sicherheitsheader und Content Security Policy stehen NICHT hier,
# sondern in `frontend/_headers`. Bitte ausschliesslich dort nachführen. Zwei
# Fassungen derselben Richtlinie führen zu Fehlern, die sich kaum finden
# lassen, weil der Browser blockierte Aufrufe stillschweigend verwirft. Die
# Erläuterung zu jeder einzelnen Regel steht als Kommentar in jener Datei.

[build]
  # Nichts zu bauen: der Ordner wird so ausgeliefert, wie er im Repository liegt.
  publish = "frontend"
  command = ""

[build.processing]
  # Keine nachträgliche Optimierung durch Netlify. Die Seite bindet MSAL mit
  # fester Version und Prüfsumme (integrity="sha384-…") ein; ausgeliefert werden
  # soll Byte für Byte das, was im Repository steht.
  skip_processing = true

# Vorschau-Deploys aus Pull Requests und aus anderen Zweigen laufen mit
# denselben Einstellungen. Sie erhalten eine eigene Adresse bei netlify.app.
# Damit dort die Anmeldung funktioniert, müsste die jeweilige Adresse in der
# Entra-ID-App-Registrierung als Umleitungsadresse eingetragen sein; ohne
# diesen Eintrag lassen sich Vorschauen nur mit `?mock=1` anschauen.
[context.deploy-preview]
  publish = "frontend"

[context.branch-deploy]
  publish = "frontend"
